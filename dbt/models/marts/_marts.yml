version: 2

models:
  - name: int_overlap_counts
    description: >
      Кількості для питання 1. Grain — сегмент × група активності.
      n_s / x_s — гравці S.T.A.L.K.E.R. 2 без Far Cry 5 / з них грали в Metro.
      n_f / x_f — те саме для Far Cry 5 без S.T.A.L.K.E.R. 2.
    data_tests:
      - unique:
          arguments:
            column_name: "segment || '-' || activity_group"

  - name: mart_overlap
    description: >
      Питання 1: чи гравці S.T.A.L.K.E.R. 2 частіше грали в Metro, ніж гравці Far Cry 5.
      Частки, 95% CI, lift з CI, z-тест, p-value. Grain — сегмент × група активності.
    data_tests:
      - unique:
          arguments:
            column_name: "segment || '-' || activity_group"
    columns:
      - name: lift
        description: p_s / p_f. 2.0 = удвічі частіше за норму.
      - name: z
        description: z-тест двох часток. |z| ≥ 2.69 — різниця не випадкова (Бонферроні).
  
  - name: int_satisfaction_counts
    description: >
      Кількості для питання 2 (лише Metro Exodus). Grain — сегмент.
      n_c / x_c — спільні гравці (S⁺ ∩ Exodus) / з них позитивні відгуки на Exodus.
      n_o / x_o — «лише Metro» / з них позитивні.
    columns:
      - name: segment
        data_tests: [unique, not_null]

  - name: mart_satisfaction
    description: >
      Питання 2: чи сподобалась Metro Exodus спільним гравцям так само, як фанатам «лише Metro».
      delta_pp = pos_c − pos_o у п.п. з 95% CI. Grain — сегмент.
    columns:
      - name: segment
        data_tests: [unique, not_null]
      - name: delta_pp
        description: Різниця задоволеності, п.п. ≥ −5 = «сподобалась не гірше» (умова B).
  
  - name: int_audience
    description: M8 — гравці S.T.A.L.K.E.R. 2 (S⁺), які ще не грали в Metro. Grain — сегмент.
    columns:
      - name: segment
        data_tests: [unique, not_null]

  - name: mart_decision
    description: >
      Таблиця рішень за docs/decision_rule.md. Grain — сегмент (7 мов + «5 мов ЄС»).
      label — мітка сегмента; action — дія з урахуванням «Мало даних» і сценарію english.
    config:
      contract:
        enforced: true
    columns:
      - name: segment
        data_type: text
        data_tests: [unique, not_null]
      - name: label
        data_type: text
        data_tests:
          - accepted_values:
              arguments:
                values: ["Так", "Тестово", "Ні", "Мало даних"]
      - name: action
        data_type: text
        data_tests: [not_null]
      - name: reason
        data_type: text
      - name: priority
        data_type: integer
      - name: lift
        data_type: numeric(10, 4)
      - name: lift_ci_low
        data_type: numeric(10, 4)
      - name: lift_ci_high
        data_type: numeric(10, 4)
      - name: z
        data_type: numeric(10, 4)
      - name: p_value
        data_type: numeric(10, 6)
      - name: delta_pp
        data_type: numeric(10, 2)
      - name: delta_pp_ci_low
        data_type: numeric(10, 2)
      - name: delta_pp_ci_high
        data_type: numeric(10, 2)
      - name: audience_not_played
        description: M8 — скільки гравців S.T.A.L.K.E.R. 2 ще не грали в Metro.
        data_type: bigint
      - name: n_s
        data_type: bigint
      - name: n_f
        data_type: bigint
      - name: n_c
        data_type: bigint
      - name: n_o
        data_type: bigint

unit_tests:
  - name: mart_overlap_formulas
    description: Формули CI, lift, z і p-value на відомих числах (пораховано окремо в Python).
    model: mart_overlap
    given:
      - input: ref('int_overlap_counts')
        rows:
          - {segment: lift_2, activity_group: all, n_s: 1000, x_s: 200, n_f: 1000, x_f: 100}
          - {segment: equal, activity_group: all, n_s: 500, x_s: 50, n_f: 500, x_f: 50}
          - {segment: empty, activity_group: all, n_s: 0, x_s: 0, n_f: 100, x_f: 10}
    expect:
      rows:
        - {segment: lift_2, p_s: 0.2, p_s_ci_low: 0.1752, p_s_ci_high: 0.2248,
           p_f: 0.1, p_f_ci_low: 0.0814, p_f_ci_high: 0.1186,
           lift: 2.0, lift_ci_low: 1.5995, lift_ci_high: 2.5008,
           z: 6.2622, p_value: 0.0}
        - {segment: equal, p_s: 0.1, p_s_ci_low: 0.0737, p_s_ci_high: 0.1263,
           p_f: 0.1, p_f_ci_low: 0.0737, p_f_ci_high: 0.1263,
           lift: 1.0, lift_ci_low: 0.6894, lift_ci_high: 1.4505,
           z: 0.0, p_value: 1.0}
        - {segment: empty, p_s: null, p_s_ci_low: null, p_s_ci_high: null,
           p_f: 0.1, p_f_ci_low: 0.0412, p_f_ci_high: 0.1588,
           lift: null, lift_ci_low: null, lift_ci_high: null,
           z: null, p_value: null}
  
  - name: mart_satisfaction_formulas
    description: Різниця часток і її 95% CI у п.п. (пораховано окремо в Python).
    model: mart_satisfaction
    given:
      - input: ref('int_satisfaction_counts')
        rows:
          - {segment: diff_10, n_c: 100, x_c: 90, n_o: 1000, x_o: 800}
    expect:
      rows:
        - {segment: diff_10, pos_c: 0.9, pos_o: 0.8, delta_pp: 10.0,
           delta_pp_ci_low: 3.62, delta_pp_ci_high: 16.38}