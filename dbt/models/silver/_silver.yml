version: 2

models:
  - name: stg_reviews
    description: >
      Відгуки Steam без дублів, до analysis_end_date. Час — UTC.
      Один рядок = один відгук = один гравець × гра.
    columns:
      - name: review_id
        description: ID відгуку в Steam.
        data_tests: [unique, not_null]
      - name: appid
        description: ID гри в Steam.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1643320, 552520, 412020, 286690, 287390]
      - name: language
        description: Мова клієнта Steam автора = сегмент.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('languages')
                field: language
              config:
                severity: warn
      - name: player_id
        description: sha256(steamid + сіль). Справжній steamid далі не йде.
        data_tests: [not_null]
      - name: is_positive
        description: true = автор рекомендує гру.
        data_tests: [not_null]
      - name: author_num_reviews
        description: Скільки відгуків автор написав у Steam (на момент завантаження).
      - name: playtime_h
        description: Години в грі на момент відгуку.
      - name: created_at_utc
        description: Час створення відгуку, UTC.
        data_tests: [not_null]
  
  - name: stg_prices
    description: >
      Поточні ціни 6 ігор у США і Україні. Ціни в одиницях валюти (не центах).
      price_final_usd — за останнім відомим курсом НБУ.
    data_tests:
      - unique:
          arguments:
            column_name: "appid || '-' || country"
    columns:
      - name: country
        description: Країна магазину Steam.
        data_tests:
          - accepted_values:
              arguments:
                values: ["us", "ua"]
      - name: currency
        data_tests:
          - accepted_values:
              arguments:
                values: ["USD", "UAH"]
      - name: price_final_usd
        description: Ціна зі знижкою в доларах США.
        data_tests: [not_null]

  - name: stg_comments
    description: Коментарі до трейлерів METRO 2039 до analysis_end_date. Час — UTC.
    columns:
      - name: comment_id
        data_tests: [unique, not_null]
      - name: video_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('videos')
                field: video_id
  
  - name: stg_comment_sentiment
    description: Настрій коментаря за VADER — compound і мітка за порогами з vars.
    columns:
      - name: comment_id
        data_tests: [unique, not_null]
      - name: sentiment
        data_tests:
          - accepted_values:
              arguments:
                values: [positive, negative, neutral]