name: metro_stalker
version: "1.0.0"
profile: metro_stalker

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Межа даних (не включно): 19.10.2026 00:00 UTC — як date_range_end у dlt
  analysis_end_date: "2026-10-19"
  # Статистика і правило рішення — ті самі числа, що в docs/decision_rule.md
  z_95: 1.96
  z_bonferroni: 2.69
  lift_threshold: 1.5
  satisfaction_delta_pp: -5
  min_group_n: 100
  min_group_x: 10
  # VADER: стандартні пороги авторів бібліотеки
  vader_positive: 0.05
  vader_negative: -0.05

models:
  metro_stalker:
    silver:
      +schema: silver
      +materialized: view
    gold:
      +schema: gold
      +materialized: table
    marts:
      +schema: marts
      +materialized: table

seeds:
  metro_stalker:
    +schema: seeds