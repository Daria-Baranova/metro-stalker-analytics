# Скільки потоків качають одночасно
[extract]
workers = 8

# Налаштування інжесту відгуків Steam (без секретів)
[sources.steam_reviews]
languages = ["english", "ukrainian", "german", "french", "spanish", "italian", "polish"]

# Кінець вікна для ВСІХ ігор: 19.10.2026 00:00 UTC
date_range_end = 1792368000

# S.T.A.L.K.E.R. 2 і Far Cry 5: з 20.11.2024 00:00 UTC
base_appids = [1643320, 552520]
base_start = 1732060800

# Metro Exodus, 2033 Redux, Last Light Redux: усі відгуки
# 1, а не 0: 0 вимикає фільтр дат і бере відгуки після кінця вікна
metro_appids = [412020, 286690, 287390]
metro_start = 1

# Ділимо вікно на шматки по N днів (кожен шматок — окремий потік)
chunk_days = 30

# Повтори запитів при 429 і 5xx (dlt requests helper)
[runtime]
request_max_attempts = 8       # скільки разів пробувати
request_backoff_factor = 1     # пауза 1, 2, 4, 8... с
request_max_retry_delay = 60   # не чекати довше 60 с
request_timeout = 30           # чекати відповідь до 30 с

[sources.steam_appdetails]
appids = [1643320, 552520, 412020, 286690, 287390, 2590240]
country = "us"